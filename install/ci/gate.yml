# vibe-safe CI gate. Installed by anf-skills as .github/workflows/vibe-safe-gate.yml.
# Runs on every change to the default branch and every pull request. It fails closed:
# a missing test command is a failure, not a pass, because a green run that ran nothing
# is worse than a red one (you would trust it).
#
# The installer pins each action to a commit (the `@<sha>` form) so that what runs is what
# was reviewed; the tag is kept in the comment for humans. If a pin is stale, re-pin with
#   git ls-remote https://github.com/actions/checkout refs/tags/v4.2.2
name: vibe-safe gate

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@PIN_CHECKOUT # v4.2.2
        with:
          fetch-depth: 0

      - name: Secret scan over every tracked file
        run: sh scripts/secret-scan.sh --tree

      - name: Detect the ecosystem
        id: eco
        run: |
          if [ -f package.json ]; then echo "kind=node" >> "$GITHUB_OUTPUT";
          elif [ -f pyproject.toml ] || [ -f requirements.txt ]; then echo "kind=python" >> "$GITHUB_OUTPUT";
          else echo "kind=other" >> "$GITHUB_OUTPUT"; fi

      # ── Node ────────────────────────────────────────────────────────────────
      - uses: actions/setup-node@PIN_SETUP_NODE # v4.1.0
        if: steps.eco.outputs.kind == 'node'
        with:
          node-version-file: ${{ hashFiles('.nvmrc') != '' && '.nvmrc' || 'package.json' }}
          cache: npm

      - name: Install from the lockfile
        if: steps.eco.outputs.kind == 'node'
        run: |
          if [ ! -f package-lock.json ]; then
            echo "::error::no package-lock.json. A lockfile is what makes a fresh clone install the same versions; run npm install once and commit the lockfile." ; exit 1
          fi
          npm ci

      - name: Lint and typecheck (if declared)
        if: steps.eco.outputs.kind == 'node'
        run: |
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Build (if declared)
        if: steps.eco.outputs.kind == 'node'
        run: npm run build --if-present

      - name: Test (must exist)
        if: steps.eco.outputs.kind == 'node'
        run: |
          if ! node -e 'const s=require("./package.json").scripts||{}; if(!s.test||/no test specified/.test(s.test)) process.exit(1)'; then
            echo "::error::no test script in package.json. The gate fails closed on purpose: add one test that runs the login or the main path, and a \"test\" script that runs it." ; exit 1
          fi
          npm test

      # ── Python ──────────────────────────────────────────────────────────────
      - uses: actions/setup-python@PIN_SETUP_PYTHON # v5.3.0
        if: steps.eco.outputs.kind == 'python'
        with:
          python-version-file: ${{ hashFiles('.python-version') != '' && '.python-version' || 'pyproject.toml' }}

      - name: Install
        if: steps.eco.outputs.kind == 'python'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . ; fi
          pip install pytest

      - name: Test (must exist)
        if: steps.eco.outputs.kind == 'python'
        run: |
          if ! ls tests test_*.py */test_*.py >/dev/null 2>&1; then
            echo "::error::no tests found. The gate fails closed on purpose: add one test that runs the login or the main path." ; exit 1
          fi
          pytest -q

      # ── Anything else ───────────────────────────────────────────────────────
      - name: Unknown ecosystem
        if: steps.eco.outputs.kind == 'other'
        run: |
          echo "::error::the gate does not know how to install and test this project yet. Add the steps for it to this workflow; until then the gate fails closed." ; exit 1
